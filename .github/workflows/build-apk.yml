name: Build Koshary Om Saif APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: تحميل المكتبات
        run: flutter pub get

      - name: إنشاء أيقونة التطبيق
        run: dart run flutter_launcher_icons

      - name: فحص المشروع
        run: flutter analyze || true

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: koshary-om-saif-apk
          path: build/app/outputs/flutter-apk/app-release.apk