name: Build Koshary Om Saif Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: تفعيل Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: تحميل المكتبات
        run: flutter pub get

      - name: تحويل اللوجو إلى ICO
        shell: pwsh
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; im=Image.open('assets/images/logo.jpg').convert('RGBA'); im.save('windows/runner/resources/app_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: فحص المشروع
        run: flutter analyze || true

      - name: بناء نسخة Windows
        run: flutter build windows --release

      - name: إنشاء ملف Inno Setup
        shell: pwsh
        run: |
          @"
          [Setup]
          AppName=كشري أم سيف
          AppVersion=4.0.0
          DefaultDirName={autopf}\Koshary Om Saif
          DefaultGroupName=كشري أم سيف
          OutputDir=installer
          OutputBaseFilename=Koshary-Om-Saif-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\cashier_pro.exe

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autodesktop}\كشري أم سيف"; Filename: "{app}\cashier_pro.exe"; WorkingDir: "{app}"
          Name: "{group}\كشري أم سيف"; Filename: "{app}\cashier_pro.exe"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\cashier_pro.exe"; Description: "تشغيل كشري أم سيف"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding UTF8 installer.iss

      - name: تثبيت Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: بناء المثبت
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: رفع المثبت
        uses: actions/upload-artifact@v4
        with:
          name: koshary-om-saif-installer
          path: installer/Koshary-Om-Saif-Setup.exe