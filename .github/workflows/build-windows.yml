name: Build Koshary Om Saif Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: تفعيل Windows
        run: flutter config --enable-windows-desktop

      - name: تحميل المكتبات
        run: flutter pub get

      - name: تحويل اللوجو إلى ICO
        shell: pwsh
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; im=Image.open('assets/images/logo.jpg').convert('RGBA'); im.save('windows/runner/resources/app_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: فحص المشروع
        run: flutter analyze || true

      - name: بناء نسخة Windows
        run: flutter build windows --release

      - name: ضغط البرنامج
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "koshary-om-saif-windows.zip"

      - name: رفع نسخة Windows
        uses: actions/upload-artifact@v4
        with:
          name: koshary-om-saif-windows
          path: koshary-om-saif-windows.zip